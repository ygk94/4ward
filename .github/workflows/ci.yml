name: CI
on:
  push:
  pull_request:
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
      - run: cargo test
      - name: Tests du mode démo (feature demo)
        run: cargo test -p pool --features demo
      - name: Installer stellar-cli 28.1.0
        run: |
          mkdir -p "$HOME/bin"
          curl -sSfL https://github.com/stellar/stellar-cli/releases/download/v28.1.0/stellar-cli-28.1.0-x86_64-unknown-linux-gnu.tar.gz | tar xz -C "$HOME/bin" stellar
          echo "$HOME/bin" >> "$GITHUB_PATH"
          "$HOME/bin/stellar" --version
      - name: Build des contrats (production, puis démo)
        run: |
          stellar contract build
          sha256sum target/wasm32v1-none/release/pool.wasm
          stellar contract build --package pool --features demo
  front:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: front/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: cp .env.example .env.local
      - run: pnpm build
