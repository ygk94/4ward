[package]
name = "pool"
version = "0.0.0"
edition = "2021"
publish = false
authors.workspace = true
license-file.workspace = true

[lib]
crate-type = ["lib", "cdylib"]
doctest = false

[features]
# Mode démo (échéances accélérées par `set_time_factor`) : testnet et vidéo uniquement, jamais en production.
demo = []

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
mock-oracle = { path = "../mock-oracle" }
